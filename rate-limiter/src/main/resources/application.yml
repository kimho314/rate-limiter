spring:
  application:
    name: rate-limiter
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, configprops
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.sprint.ratelimiter: DEBUG
    org.springframework.data.redis: INFO

ratelimit:
  failure-mode: ALLOW
  tiers:
    FREE:
      capacity: 10
      refill-rate: 0.5     # 30 req/min steady, burst up to 10
    PREMIUM:
      capacity: 100
      refill-rate: 10      # 600 req/min steady, burst up to 100
    ENTERPRISE:
      capacity: 1000
      refill-rate: 100     # 6000 req/min steady, burst up to 1000

jwt:
  # In prod: file:/etc/secrets/public.pem (mounted by your secret manager / k8s)
  public-key: file:./keys/public.pem
  tier-claim: tier